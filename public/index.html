<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- DAISYUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- DAISYUI THEMES -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- GOOGLE COMPONENTS -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>
    <!-- TurfJS -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <!-- ShadeMap -->
    <script
      src="https://unpkg.com/leaflet-shadow-simulator/dist/leaflet-shadow-simulator.umd.min.js"
      defer
    ></script>
    <!-- Buildings -->
    <script src="https://unpkg.com/osmtogeojson/osmtogeojson.js" defer></script>
    <!-- LeafletRoutingMachine -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
    />
    <script
      src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"
      defer
    ></script>

    <!-- components -->
    <script type="module" src="./components/loading-spinner.js" defer></script>
    <script type="module" src="./components/site-navbar.js" defer></script>
    <script type="module" src="./components/speed-dial.js" defer></script>
    <script type="module" src="js/map.js" defer></script>
    <script src="js/score.js" defer></script>
    <script type="module" src="./components/site-profile.js" defer></script>
    <script
      type="module"
      src="./components/temperature-container.js"
      defer
    ></script>

    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <site-navbar></site-navbar>
    <site-profile></site-profile>
    <loading-spinner-modal></loading-spinner-modal>

    <div id="map" class="h-screen w-screen relative">
      <!-- SPEED DIAL COMPONENT - TODO: technical debt -->
      <!-- <speed-dial></speed-dial> -->
      <!-- TEMPERATURE COMPONENT -->
      <temperature-container></temperature-container>
    </div>
  </body>
</html>
