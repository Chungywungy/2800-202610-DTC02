<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- IMPORTS -->
    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- DAISYUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- DAISYUI THEMES -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- SCRIPTS -->
    <script src="./js/login.js" defer></script>
  </head>
  <body
    class="bg-[linear-gradient(to_top,rgba(34,197,94,0.5),rgba(59,130,246,0.5)),url('./images/background-vancouver-backdrop.avif')] bg-cover bg-no-repeat max-h-screen"
  >
    <div
      id="bodyContainer"
      class="max-w-6xl mx-auto flex justify-center items-center min-h-screen my-auto"
    >
      <!-- LOGIN FORM -->
      <form
        id="loginFormContainer"
        action="/auth/login"
        class="w-1/2 flex justify-center fieldset bg-base-200/90 border-base-300 rounded-box flex-col border px-30 py-5"
      >
        <fieldset class="fieldset py-5 w-full">
          <h1 class="font-bold text-5xl pb-5 text-center">Login</h1>
          <label class="label">Email or username</label>
          <input
            type="email"
            class="input w-full"
            placeholder="Email or username"
          />

          <label class="label">Password</label>
          <input type="password" class="input w-full" placeholder="Password" />

          <button class="btn bg-blue-500 text-white mt-4 hover:outline-1">
            Login
          </button>
          <label class="">
            <input type="checkbox" checked="checked" class="" />
            Remember me
          </label>
        </fieldset>
        <a
          id="createAccountBtn"
          class="hover:underline hover:text-blue-700 cursor-pointer text-center"
        >
          Create an account
        </a>
      </form>
      <!-- REGISTER FORM -->
      <form
        id="registerFormContainer"
        action="/auth/register"
        class="w-1/2 flex justify-center fieldset bg-base-200/90 border-base-300 rounded-box flex-col border px-30 py-5 hidden"
      >
        <fieldset class="fieldset py-5 w-full">
          <h1 class="font-bold text-5xl pb-5 text-center">Register</h1>

          <!-- EMAIL -->
          <label class="label">Email</label>
          <input type="email" class="input w-full" placeholder="Email" />

          <!-- PASSWORD -->
          <label class="label">Password</label>
          <input type="password" class="input w-full" placeholder="Password" />

          <!-- CONFIRM PASSWORD -->
          <label class="label">Confirm password</label>
          <input type="password" class="input w-full" placeholder="Password" />

          <!-- ROLE -->
          <label class="label">Select a role</label>
          <select class="select">
            <option disabled selected>Select a role</option>
            <option>Resident</option>
            <option>Employee</option>
          </select>

          <button class="btn bg-green-500 text-white mt-4 hover:outline-1">
            Register
          </button>
        </fieldset>
        <a
          id="alreadyHaveAccountBtn"
          class="hover:underline hover:text-blue-700 cursor-pointer text-center"
        >
          Already have an account
        </a>
      </form>
    </div>
  </body>
</html>
