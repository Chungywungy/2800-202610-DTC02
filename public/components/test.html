<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- DAISYUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- GOOGLE COMPONENTS -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <!-- separator -->
    <section id="speedDialContainer" class="z-10000000 bottom-5 left-1 fixed">
      <div class="fab">
        <!-- a focusable div with tabindex is necessary to work on all browsers. role="button" is necessary for accessibility -->
        <div tabindex="0" role="button" class="btn btn-circle btn-lg">
          <span class="material-symbols-outlined"> add </span>
        </div>

        <!-- Main Action button replaces the original button when FAB is open -->
        <button class="fab-main-action btn btn-circle btn-lg btn-primary">
          <span class="material-symbols-outlined"> keyboard_command_key </span>
        </button>

        <!-- buttons that show up when FAB is open -->
        <!-- Cancel Action -->
        <section id="reportActionContainer">
          <input
            type="radio"
            name="fab-action"
            id="fabReport"
            class="radio hidden"
          />
          <!-- tooltip container -->
          <div class="tooltip tooltip-left" data-tip="Close">
            <!-- button component -->
            <label
              for="fab-weather"
              class="btn bg-red-600 btn-circle btn-lg text-white"
            >
              <span class="material-symbols-outlined text-white"> close </span>
            </label>
          </div>
        </section>
        <!-- Wayfinding Action -->
        <section id="wayfindingActionContainer">
          <input
            type="radio"
            name="fab-action"
            id="fabWayfinding"
            class="radio hidden"
          />
          <!-- tooltip container -->
          <div class="tooltip tooltip-left" data-tip="Wayfinding">
            <!-- button component -->
            <label for="fab-weather" class="btn btn-circle btn-lg text-white">
              <span class="material-symbols-outlined text-black"> route </span>
            </label>
          </div>
        </section>

        <!-- Weather Action -->
        <section id="weatherActionContainer">
          <input
            type="radio"
            name="fab-action"
            id="fabWeather"
            class="radio hidden"
          />
          <!-- tooltip container -->
          <div class="tooltip tooltip-left" data-tip="Weather">
            <!-- button component -->
            <label for="fab-weather" class="btn btn-circle btn-lg text-white">
              <span class="material-symbols-outlined text-black"> sunny </span>
            </label>
          </div>
        </section>

        <!-- Report Action -->
        <section id="reportActionContainer">
          <input
            type="radio"
            name="fab-action"
            id="fabReport"
            class="radio hidden"
          />
          <!-- tooltip container -->
          <div class="tooltip tooltip-left" data-tip="Report">
            <!-- button component -->
            <label for="fab-weather" class="btn btn-circle btn-lg text-white">
              <span class="material-symbols-outlined text-black">
                add_notes
              </span>
            </label>
          </div>
        </section>
      </div>
    </section>
    <!-- separator -->
  </body>
</html>
